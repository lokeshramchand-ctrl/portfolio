name: Deploy Portfolio to Homelab

on:
  push:
    branches:
      - perf/audit-fixes # Or 'master', depending on your default branch

jobs:
  build-and-deploy:
    runs-on: self-hosted # This tells GitHub to use your homelab server
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match this to your project's node version

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Copy to Nginx Directory
        run: |
          # Clear the old files
          rm -rf /var/www/portfolio/dist/*
          
          # Copy the new build files 
          # (Vue usually outputs to 'dist', React usually outputs to 'build')
          cp -r dist/* /var/www/portfolio/dist/ 

      - name: Send ntfy notification
        if: always()
        run: |
          curl \
            -H "Title: Lokeshrc Deployment" \
            -H "Tags: github" \
            -d "Deployment Status: ${{ job.status }}" \
            https://ntfy.splsystems.in/lokeshrc