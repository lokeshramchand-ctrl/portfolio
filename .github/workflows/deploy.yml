name: Deploy Portfolio to Homelab

on:
  push:
    branches:
      - perf/audit-fixes # Or 'master', depending on your default branch

jobs:
  build-and-deploy:
    runs-on: self-hosted # This tells GitHub to use your homelab server
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match this to your project's node version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy to Nginx Directory
        run: |
          # Build into a fresh staging dir, then swap atomically so Nginx
          # never serves a half-written directory mid-deploy.
          rm -rf /var/www/portfolio/dist.new
          cp -r dist /var/www/portfolio/dist.new
          rm -rf /var/www/portfolio/dist.old
          mv /var/www/portfolio/dist /var/www/portfolio/dist.old
          mv /var/www/portfolio/dist.new /var/www/portfolio/dist
          rm -rf /var/www/portfolio/dist.old

      - name: Send ntfy notification
        if: always()
        run: |
          curl \
            -H "Title: Lokeshrc Deployment" \
            -H "Tags: github" \
            -d "Deployment Status: ${{ job.status }}" \
            https://ntfy.splsystems.in/lokeshrc